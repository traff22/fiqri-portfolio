<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-label="A bright, carefully arranged pixel-isometric editing room with mini Fiqri, dual displays, a desk, computer, plants and coffee.">
<defs>
  <linearGradient id="room-wall" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#223b76"/><stop offset=".57" stop-color="#182e62"/><stop offset="1" stop-color="#101e43"/></linearGradient>
  <linearGradient id="room-floor" x1=".2" x2=".7" y1="0" y2="1"><stop stop-color="#394f84"/><stop offset="1" stop-color="#1e305c"/></linearGradient>
  <linearGradient id="tabletop" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#c6d4f2"/><stop offset="1" stop-color="#8ca4cf"/></linearGradient>
  <linearGradient id="monitor" x1="0" x2="1"><stop stop-color="#162a54"/><stop offset="1" stop-color="#101c40"/></linearGradient>
  <linearGradient id="sunset" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#6578bd"/><stop offset="1" stop-color="#2d4b83"/></linearGradient>
  <radialGradient id="room-light"><stop stop-color="#7899fb" stop-opacity=".25"/><stop offset="1" stop-color="#7793f5" stop-opacity="0"/></radialGradient>
  <filter id="room-shadow"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="screenA"><rect x="281" y="175" width="168" height="110" rx="3"/></clipPath>
  <clipPath id="screenB"><rect x="473" y="175" width="168" height="110" rx="3"/></clipPath>
</defs>
<!-- One coherent set: back wall -> floor -> furniture -> character -> desktop props. -->
<g class="fq-room-scene">
  <!-- Wall and side pillars, orthographic with shallow isometric floor -->
  <path d="M76 55H844V375H76Z" fill="url(#room-wall)" stroke="#607cb4" stroke-width="3"/>
  <path d="M76 55L45 80V399L76 375Z" fill="#14264f" stroke="#4f6397" stroke-width="2"/>
  <path d="M844 55L875 80V399L844 375Z" fill="#0b1c40" stroke="#4f6397" stroke-width="2"/>
  <path d="M76 375H844L905 508H15Z" fill="url(#room-floor)" stroke="#6784b7" stroke-width="2"/>
  <path d="M15 508H905L868 537H52Z" fill="#14254b" stroke="#506aa2" stroke-width="2"/>
  <path d="M76 374H844" stroke="#bdd1ff78" stroke-width="3"/>
  <path d="M90 408H834M67 447H857M41 485H880M220 376 157 508M374 375 354 508M549 375 572 508M698 375 757 508" fill="none" stroke="#8ba9da1c" stroke-width="2"/>
  <ellipse cx="450" cy="265" rx="280" ry="195" fill="url(#room-light)"/>
  <!-- Window in left third, intentional narrow composition -->
  <rect x="125" y="122" width="148" height="162" rx="7" fill="#0d1e40" stroke="#789be0" stroke-width="4"/>
  <rect x="135" y="132" width="128" height="141" rx="2" fill="url(#sunset)"/>
  <path d="M139 249V218H152V237H168V201H179V225H191V190H211V234H225V211H246V251Z" fill="#243961"/>
  <path d="M139 260V238H159V247H176V226H197V251H218V231H245V260Z" fill="#162d57"/>
  <path d="M199 132v141M135 202h128" stroke="#c5d4ff7c" stroke-width="6"/>
  <path d="M151 154h25m-24 8h17" stroke="#e6e8ff6f" stroke-width="3"/>
  <!-- Motivational frame and sound waveform on right -->
  <rect x="692" y="126" width="122" height="111" rx="5" fill="#101e43" stroke="#92a9e3" stroke-width="3"/>
  <path d="M711 168h15l5-8 10 24 9-46 10 30 7-9 9 10h18" stroke="#a7cbff" stroke-width="3" fill="none"/>
  <path d="M712 193H793" stroke="#7b92d3" stroke-width="2"/>
  <text x="712" y="214" font-size="10" fill="#bbcfff" font-family="monospace" letter-spacing="1">SOUND / FEEL</text>
  <!-- floating wall shelf, concrete physical objects -->
  <rect x="320" y="126" width="100" height="8" rx="2" fill="#859ed1"/>
  <path d="M332 116V95H352V116M360 116V88H380V116M386 116V99H405V116" fill="#506fc0" stroke="#8595d3" stroke-width="2"/>
  <path d="M337 100h8M366 92h8M392 104h8" stroke="#c9d8ff" stroke-width="2"/>
  <!-- center ceiling light / deliberate cinematic glint -->
  <rect x="462" y="89" width="115" height="8" rx="3" fill="#b2c9ff" opacity=".81"/>
  <path d="M460 105L419 238H623L579 105Z" fill="#9ab7ff" opacity=".055"/>
</g>
<!-- furniture behind the editor -->
<ellipse cx="460" cy="451" rx="292" ry="39" fill="#000b2d75" filter="url(#room-shadow)"/>
<g class="fq-workspace__screen fq-workspace__screen--a" data-studio-object="screen" tabindex="0" role="button" aria-label="Preview monitor: click to return to editing">
 <rect x="272" y="166" width="186" height="128" rx="9" fill="#0a1533" stroke="#9fb6f6" stroke-width="5"/>
 <rect x="281" y="175" width="168" height="110" rx="3" fill="url(#monitor)"/>
 <g clip-path="url(#screenA)">
  <path d="M281 176H449V197H281Z" fill="#273966"/>
  <circle cx="292" cy="186" r="3" fill="#f1a9b0"/><circle cx="303" cy="186" r="3" fill="#eed5ac"/><circle cx="314" cy="186" r="3" fill="#8ddbcc"/>
  <text x="323" y="189" font-size="9" fill="#d2deff" font-family="monospace">SEQUENCE 01</text>
  <rect x="291" y="205" width="84" height="44" rx="3" fill="#4761a7"/>
  <path d="M291 243 310 225 324 232 343 209 375 235V249H291" fill="#789be5"/>
  <path d="M328 212 320 226 340 224Z" fill="#c5d9ff"/>
  <rect x="385" y="205" width="54" height="9" rx="2" fill="#526aa7"/>
  <rect x="385" y="220" width="45" height="5" rx="2" fill="#6376ae"/>
  <rect x="385" y="231" width="52" height="5" rx="2" fill="#6376ae"/>
  <path d="M288 259H444" stroke="#8aa1cf" stroke-width="1"/>
  <rect x="291" y="265" width="38" height="6" rx="1" fill="#7e99e8"/>
  <rect x="331" y="265" width="45" height="6" rx="1" fill="#63d0d2"/>
  <rect x="378" y="265" width="35" height="6" rx="1" fill="#a2aaf9"/>
  <rect x="299" y="275" width="62" height="4" rx="1" fill="#ad92e5"/>
  <rect x="363" y="275" width="47" height="4" rx="1" fill="#668cdf"/>
  <path class="fq-monitor-playhead" d="M298 255V285" stroke="#e3f2ff" stroke-width="2"/>
 </g>
 <rect x="352" y="294" width="25" height="42" fill="#455f99"/>
 <path d="M322 335H406V343H322Z" fill="#7791c6"/>
</g>
<g class="fq-workspace__screen fq-workspace__screen--b" data-studio-object="render" tabindex="0" role="button" aria-label="Output monitor: click to render the film">
 <rect x="464" y="166" width="186" height="128" rx="9" fill="#0a1533" stroke="#9fb6f6" stroke-width="5"/>
 <rect x="473" y="175" width="168" height="110" rx="3" fill="url(#monitor)"/>
 <g clip-path="url(#screenB)">
  <path d="M473 176H641V197H473Z" fill="#273966"/>
  <text x="481" y="189" font-size="9" fill="#d2deff" font-family="monospace">COLOR / MOTION</text>
  <rect x="484" y="206" width="94" height="49" rx="2" fill="#3f559b"/>
  <path d="M484 244 512 225 526 232 542 215 578 245V255H484" fill="#829deb"/>
  <path d="M543 219 556 230H531Z" fill="#c9d6ff"/>
  <rect x="586" y="206" width="45" height="9" rx="2" fill="#af91df"/>
  <rect x="586" y="219" width="39" height="9" rx="2" fill="#6995e7"/>
  <rect x="586" y="232" width="45" height="9" rx="2" fill="#5fbba9"/>
  <path d="M484 264H629" stroke="#7c96d1" stroke-width="2"/>
  <path d="M487 271 505 268 518 275 532 263 545 276 560 268 572 272 591 264 609 274 626 268" stroke="#9fc6fa" stroke-width="2" fill="none"/>
 </g>
 <g class="fq-render-progress" opacity="0">
  <rect x="483" y="213" width="145" height="48" rx="6" fill="#0b1534" stroke="#c1d0ff" stroke-width="1"/>
  <text x="494" y="231" font-size="11" fill="#e6eeff" font-family="monospace">RENDERING...</text>
  <rect x="495" y="239" width="120" height="7" rx="2" fill="#394870"/>
  <rect class="fq-render-bar" x="495" y="239" width="120" height="7" rx="2" fill="#88dbc8"/>
 </g>
 <rect x="545" y="294" width="25" height="42" fill="#455f99"/>
 <path d="M516 335H599V343H516Z" fill="#7791c6"/>
</g>
<!-- coherent desk geometry, screen stands sit directly on desk top -->
<g class="fq-workspace__furniture">
 <rect x="227" y="380" width="26" height="105" rx="3" fill="#4a5d88"/>
 <rect x="666" y="380" width="26" height="105" rx="3" fill="#4a5d88"/>
 <path d="M183 347H727L758 391H152Z" fill="url(#tabletop)" stroke="#d1ddfc" stroke-width="4" stroke-linejoin="round"/>
 <path d="M152 391H758V414H152Z" fill="#637daa" stroke="#a7bce6" stroke-width="2"/>
 <path d="M152 413H758" stroke="#415a8b" stroke-width="4"/>
 <path d="M183 348H727" stroke="#f0f5ff8b" stroke-width="2"/>
 <rect x="311" y="359" width="252" height="26" rx="5" fill="#253c70" stroke="#7892c5" stroke-width="2"/>
 <path d="M323 367H550M324 374H550M324 380H550" stroke="#9aace0" stroke-width="2" stroke-dasharray="9 5"/>
 <rect x="581" y="362" width="30" height="18" rx="7" fill="#e8eef9" stroke="#7e90b8" stroke-width="2"/>
 <path d="M596 363V374" stroke="#6886c0" stroke-width="2"/>
</g>
<!-- chair and PC on the floor, behind character -->
<g class="fq-workspace__pc">
  <rect x="176" y="415" width="90" height="105" rx="7" fill="#152446" stroke="#829acb" stroke-width="4"/>
  <rect x="185" y="425" width="72" height="84" rx="3" fill="#202e56"/>
  <circle cx="222" cy="455" r="18" fill="#111a36" stroke="#789be2" stroke-width="3"/>
  <circle cx="222" cy="455" r="9" fill="#5e7dbd" stroke="#acd0ff" stroke-width="2"/>
  <circle cx="222" cy="490" r="8" fill="#2a4988" stroke="#83b2eb" stroke-width="2"/>
  <circle cx="250" cy="433" r="2.8" fill="#8ff4d7"/>
</g>
<g class="fq-workspace__chair">
 <path d="M731 342H796V452H731Z" rx="12" fill="#192a5a" stroke="#819ee0" stroke-width="4"/>
 <rect x="740" y="354" width="48" height="82" rx="17" fill="#284481"/>
 <path d="M724 433H809V453H724Z" fill="#334d91" stroke="#7c99d8" stroke-width="3"/>
 <rect x="761" y="451" width="9" height="54" fill="#536ea5"/>
 <path d="M729 507H805" stroke="#647fb6" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- Fiqri: a crisp, clearly identifiable pixel character *beside* the monitors. -->
<g class="fq-workspace__avatar" data-studio-object="avatar" role="button" tabindex="0" aria-label="Mini Fiqri: click to wave hello">
 <g class="fq-workspace__avatar-body">
  <path d="M704 370H787L799 445H699Z" fill="#4f68bf" stroke="#a7b9f4" stroke-width="4"/>
  <path d="M711 378H733V433H708Z" fill="#344b9a"/>
  <path d="M771 377H789V433H774Z" fill="#6882d9"/>
  <path d="M739 374H759L755 417H744Z" fill="#b5c6ff" opacity=".6"/>
  <rect x="715" y="442" width="28" height="46" fill="#192849"/>
  <rect x="756" y="442" width="30" height="46" fill="#192849"/>
  <path d="M708 487H746V498H702Z" fill="#a7b8da"/>
  <path d="M755 487H791V498H753Z" fill="#a7b8da"/>
 </g>
 <g class="fq-workspace__avatar-head">
  <rect x="724" y="354" width="33" height="25" fill="#c59679"/>
  <path d="M705 285H779V351H767V365H719V352H705Z" fill="#d6a483" stroke="#f0c6a5" stroke-width="3"/>
  <path d="M700 304V279H715V266H768V274H788V312H777V293H760V284H734V296H716V311H705Z" fill="#121b32"/>
  <path d="M711 270H755V261H773V273H780V285H761V277H730V290H710Z" fill="#2c3451"/>
  <rect x="727" y="317" width="6" height="6" fill="#232b41"/>
  <rect x="759" y="317" width="6" height="6" fill="#232b41"/>
  <path d="M734 343H754" stroke="#a36d61" stroke-width="3"/>
  <path d="M708 303V317H699V299Q702 282 719 282H774Q791 287 791 303V319H780V303" stroke="#9eb6fa" stroke-width="6" fill="none"/>
  <rect x="695" y="310" width="14" height="29" rx="3" fill="#26365e" stroke="#afc7fc" stroke-width="2"/>
  <rect x="779" y="310" width="14" height="29" rx="3" fill="#26365e" stroke="#afc7fc" stroke-width="2"/>
  <path d="M700 336Q713 355 727 349" stroke="#8b9bd4" stroke-width="3" fill="none"/>
 </g>
 <g class="fq-workspace__avatar-arm">
  <path d="M702 382L679 385L650 365L641 374L666 405L707 406Z" fill="#526ac1" stroke="#a9bdfa" stroke-width="3"/>
  <rect x="635" y="365" width="24" height="15" rx="5" fill="#d8a685"/>
 </g>
</g>
<!-- Still-life props are above the tabletop; they are physically reachable -->
<g class="fq-workspace__coffee" data-studio-object="coffee" role="button" tabindex="0" aria-label="Coffee cup: click to take a break">
 <ellipse cx="676" cy="374" rx="27" ry="7" fill="#4c5f8b73"/>
 <rect x="655" y="350" width="38" height="25" rx="5" fill="#e6ebfa" stroke="#bacdf5" stroke-width="2"/>
 <path d="M693 355H701Q709 355 709 362Q709 370 695 370" stroke="#d1ddff" stroke-width="5" fill="none"/>
 <ellipse cx="674" cy="351" rx="18" ry="5" fill="#846d7e"/>
 <g class="fq-coffee-steam" opacity="0" fill="none" stroke="#effaff" stroke-width="3" stroke-linecap="round">
  <path d="M665 339q-7-9 0-16t0-15M675 336q7-10 0-17t0-14M684 339q-6-9 0-16t0-11"/>
 </g>
</g>
<!-- Screen cursor and film-room status are small real editorial details -->
<path class="fq-workspace__cursor" d="M376 243l10 14-6-1-3 7-4-2 3-8Z" fill="#f1f5ff" stroke="#1f2e4c" stroke-width="1"/>
<text x="128" y="80" font-size="12" font-family="monospace" fill="#b8cbff" letter-spacing="2">FQ / STUDIO</text>
<text x="732" y="80" font-size="11" font-family="monospace" fill="#8de3d5" letter-spacing="1">ON AIR  ●</text>
<path d="M93 95v17m0-17h17M827 95h-17m17 0v17M93 492v-17m0 17h17M827 492h-17m17 0v-17" fill="none" stroke="#b6ccff8f" stroke-width="2"/>
<text x="330" y="533" font-size="11" font-family="monospace" fill="#b9c8ff" letter-spacing="2">CUT BY CUT / FRAME BY FRAME</text>
</svg>