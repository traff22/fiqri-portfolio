<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Share card + icon renderer</title>
<!-- Renders assets/og-card.jpg (1200x630) and the favicons.
     Run: python3 -m http.server 4173 & node tools/render-brand.mjs -->
<link rel="stylesheet" href="../assets/design-system.css">
<style>
  html,body{margin:0;background:#04060a}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;color:#edf2fa;font-family:"Archivo",sans-serif;
    background:radial-gradient(ellipse 55% 70% at 78% 45%,rgb(37 99 235/.32),transparent 72%),linear-gradient(115deg,#04060a,#080d16 60%,#04060a)}
  .og::before{content:"";position:absolute;inset:0;opacity:.55;
    background:linear-gradient(#8ea8ff14 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#8ea8ff14 1px,transparent 1px) 0 0/48px 48px;
    -webkit-mask:radial-gradient(ellipse 70% 80% at 40% 50%,#000 30%,transparent 85%);mask:radial-gradient(ellipse 70% 80% at 40% 50%,#000 30%,transparent 85%)}
  .copy{position:absolute;left:84px;top:96px;width:640px}
  .chapter{font:600 22px/1 "Archivo",sans-serif;color:#7aa6ff;margin:0 0 22px}
  h1{margin:0;font:700 128px/.9 "Archivo",sans-serif;font-stretch:72%;letter-spacing:-.018em}
  h1 em{display:block;white-space:nowrap;font:italic 400 70px/1.05 "Newsreader",serif;color:#9ec0ff;letter-spacing:-.01em;margin-top:6px}
  .timeline{display:flex;align-items:center;gap:12px;margin-top:40px;color:#cfe0ff;font:600 26px/1 "Archivo",sans-serif}
  .line{position:relative;flex:1;height:2px;background:#9ec0ff80}
  .line i{position:absolute;left:62%;top:-13px;width:3px;height:28px;background:#2563eb;box-shadow:0 0 0 1px #04060a}
  .meta{display:flex;justify-content:space-between;margin-top:16px;font:500 22px/1.3 "Archivo",sans-serif;color:#94a3b8}
  .photo{position:absolute;right:86px;top:84px;width:330px;height:430px;border-radius:18px;overflow:hidden;border:1px solid #9ec0ff66;rotate:3deg;box-shadow:0 40px 90px #000c}
  .photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
  .url{position:absolute;left:84px;bottom:46px;font:600 20px/1 "Archivo",sans-serif;color:#7aa6ff;letter-spacing:.02em}
  .icon{width:512px;height:512px;display:flex;align-items:center;justify-content:center;background:#04060a;
    font:800 300px/1 "Archivo",sans-serif;font-stretch:78%;letter-spacing:-.04em;color:#fff}
  .icon b{color:#2563eb}
</style></head>
<body>
<div class="og" id="og">
  <div class="copy">
    <p class="chapter">Video editor · Motion graphics</p>
    <h1>Fiqri Apriandi<em>stories worth feeling.</em></h1>
    <div class="timeline"><span>[</span><span class="line"><i></i></span><span>]</span></div>
    <div class="meta"><span>YouTube long-form · Product ads · Event films</span><span>Jakarta</span></div>
  </div>
  <div class="photo"><img src="../assets/fiqri-portrait-bw.webp" alt=""></div>
  <div class="url">fiqriapriandi.art</div>
</div>
<div class="icon" id="icon"><span>FQ<b>.</b></span></div>
</body></html>
