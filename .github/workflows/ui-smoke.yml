name: Portfolio layout smoke test
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/ui-smoke.mjs"
      - "scripts/montage-smoke.mjs"
      - "scripts/atmosphere-smoke.mjs"
      - "scripts/creators-lab-smoke.mjs"
      - "scripts/chapter-blueprint-smoke.mjs"
      - "scripts/design-system-smoke.mjs"
      - "scripts/media-slots-smoke.mjs"
      - "scripts/section-cuts-smoke.mjs"
      - "scripts/fixtures/**"
      - "scripts/easter-eggs-smoke.mjs"
      - "scripts/color-study-smoke.mjs"
      - "tools/prune-css.cjs"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:
jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # apt + Chromium install alone has taken ~9 min on busy runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1 postcss@8.5.6
          npx playwright install --with-deps chromium
      - name: Check layout in real Chromium
        run: |
          mkdir -p screenshots
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fiqri-ui-server.log 2>&1 &
          sleep 2
          node tools/prune-css.cjs . --check
          node scripts/color-study-smoke.mjs
          node scripts/easter-eggs-smoke.mjs
          node scripts/ui-smoke.mjs
          node scripts/montage-smoke.mjs
          node scripts/atmosphere-smoke.mjs
          node scripts/creators-lab-smoke.mjs
          node scripts/chapter-blueprint-smoke.mjs
          node scripts/design-system-smoke.mjs
          node scripts/media-slots-smoke.mjs
          node scripts/section-cuts-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-screenshots
          path: screenshots/
          if-no-files-found: ignore
